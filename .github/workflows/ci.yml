name: CI
on:
    push:
        branches:
            - master
            - serverless-migration
    pull_request:
        branches:
            - master
            - serverless-migration
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                shard: [1, 2, 3, 4]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'

            - name: Install dependencies
              run: npm ci

            - name: Lint the code
              if: matrix.shard == 1
              run: npm run lint

            - name: Run tests (ESM engine)
              run: npm test -- --shard=${{ matrix.shard }}/4

    deno:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Engine loads under Deno
              run: deno run --allow-read scripts/deno-smoke.mjs

            - name: Edge functions type-check
              run: deno check supabase/functions/discord-interactions/index.ts supabase/functions/calc-api/index.ts

            - name: Edge function handler tests
              run: |
                  deno run --allow-read --allow-env --allow-net scripts/test-interaction.mjs
                  deno run --allow-read --allow-env --allow-net scripts/test-calc-api.mjs

    deploy:
        needs: [build, deno]
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
            DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Supabase CLI
              uses: supabase/setup-cli@v1
              with:
                  version: latest

            - name: Link project
              run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

            - name: Apply database migrations
              run: supabase db push

            - name: Deploy Edge Functions
              run: |
                  supabase functions deploy discord-interactions --no-verify-jwt
                  supabase functions deploy calc-api --no-verify-jwt

            - name: Register slash commands (global)
              run: node scripts/register-commands.mjs
