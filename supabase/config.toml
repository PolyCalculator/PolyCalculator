# Supabase project configuration for PolyCalculator.
# project_id is the local linked ref; the remote project ref is set via
# `supabase link --project-ref ovuptrqnxsutoocmamnp`.
project_id = "polycalculator"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[studio]
enabled = true
port = 55323

[auth]
enabled = true

[inbucket]
enabled = true
port = 55324

[analytics]
enabled = true
port = 55327

# Discord posts unsigned (no Supabase JWT); auth is ed25519 inside the function.
# The public calculator is open. Both must skip JWT verification.
[functions.discord-interactions]
verify_jwt = false

[functions.calc-api]
verify_jwt = false
